<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Houby × Lesní vĕk — ČR</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<div id="map"></div>

<nav class="panel">
  <h3>Seznam hub</h3>
  <p id="meta"></p>
  <div id="status" class="hint">Načítejte data…</div>

  <!-- Seznam hub (výchozí pohled) -->
  <div id="mushroomListView" class="mush-view">
    <div class="mush-list" id="mushList"></div>
  </div>

  <!-- Detail konkrétní huby -->
  <div id="mushroomDetailView" class="mush-view" style="display:none;">
    <button type="button" id="backToList" class="back-btn">← Zpět na seznam hub</button>
    <div class="mush-detail" id="mushDetail"></div>
    <p id="mushAgeInfo" class="hint"></p>
  </div>

  <div class="opacity">
    <label>Průhlednost vrstvy <span id="opVal">100</span>%</label>
    <input type="range" id="opSlider" min="0" max="100" value="100" />
  </div>
  <div class="legend">
    <div><strong>Legenda (pravdĕpodobnost hub):</strong></div>
    <div><span class="swatch" style="background:#219b51"></span> nejvyšší (třída 4)</div>
    <div><span class="swatch" style="background:#86cb66"></span> 2. nejvyšší (třída 3)</div>
  </div>
  <p class="hint">Klikněte na houbu v seznamu. Na mapě se zobrazí plochy lesního vĕku, ke kterému houba patří. Kliknutím na „Zpět“ se seznam vrátí a vrstva zmizí.</p>
</nav>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
